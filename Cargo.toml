[package]
name = "rainbear"
version = "0.1.0"
edition = "2024"
publish = false
description = "Build lazy Zarr scans with Polars"
authors = ["Benjamin Sobel <ben-developer@opayq.com>"]
license = "MIT"
repository = "https://github.com/UserNobody14/iozarrpy"
documentation = "https://github.com/UserNobody14/iozarrpy"
keywords = ["zarr", "polars", "lazy"]
categories = ["data-processing"]


[lib]
name = "_core"
# "cdylib" for Python extension, "rlib" for tests
crate-type = ["cdylib", "rlib"]

[dependencies]
# "abi3-py312" tells pyo3 (and maturin) to build using the stable ABI with minimum Python version 3.12,
# matching `requires-python` in pyproject.toml. Without it, maturin cannot cross-compile wheels
# (aarch64/i686) without being told a concrete interpreter via `-i`.
# "extension-module" is enabled via feature flag (only for cdylib builds, not tests)
pyo3 = { version = "0.29", features = ["abi3-py312"] }

# Get polars from git.
#
# IMPORTANT: these features must match Python Polars' enabled DSL surface area; otherwise Expr
# deserialization can decode to the wrong FunctionExpr variants (feature-gated enum variant index drift).
#
# This list is mirrored from Polars' `polars-python` crate for the `py-1.37.1` tag.
polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.43.2", features = [
    "abs",
    "approx_unique",
    "arg_where",
    "bitwise",
    "business",
    "concat_str",
    "cum_agg",
    "cumulative_eval",
    "dataframe_arithmetic",
    "month_start",
    "month_end",
    "offset_by",
    "diagonal_concat",
    "diff",
    "dot_diagram",
    "dot_product",
    "dtype-categorical",
    "dtype-extension",
    "dtype-full",
    "dynamic_group_by",
    "ewma",
    "ewma_by",
    "fmt",
    "fused",
    "interpolate",
    "interpolate_by",
    "is_first_distinct",
    "is_last_distinct",
    "is_unique",
    "is_between",
    "is_in",
    "is_close",
    "lazy",
    "list_eval",
    "list_to_struct",
    "list_arithmetic",
    "array_arithmetic",
    "array_to_struct",
    "log",
    "mode",
    "moment",
    "ndarray",
    "partition_by",
    "product",
    "random",
    "range",
    "rank",
    "reinterpret",
    "replace",
    "rolling_window",
    "rolling_window_by",
    "round_series",
    "row_hash",
    "rows",
    "semi_anti_join",
    "serde-lazy",
    "strings",
    "temporal",
    "timezones",
    "to_dummies",
    "true_div",
    "unique_counts",
    "zip_with",
    "cov",
] }
# `FfiPlugin` lives behind `polars-lazy/ffi_plugin` (which enables the correct downstream
# `polars-expr`/`polars-plan` feature chain). Add it directly so the Expr pickle/bincode
# layout matches Python Polars when FFI plugins are present.
polars-lazy = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.43.2", features = ["ffi_plugin"] }
pyo3-polars = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.43.2", features = [
    "object",
    "dtype-extension",
    "derive",
    "lazy",
    "dtype-full",
] }
polars-arrow = { git = "https://github.com/pola-rs/polars.git", tag = "py-1.43.2" }
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros", "sync", "parking_lot"] }
url = "2.5.4"
zarrs = { version = "0.23.13", features = [
    "async",
    "sharding",
    "zlib",
    "jiff",
    "chrono",
    "bitround",
    ] }
zarrs_codec = { version = "0.2.0", features = ["async"] }
zarrs_plugin = "0.4.1"
zarrs_object_store = { version = "0.6.2", features = [
    "aws",
    "azure",
    "gcp",
    "http",
    "fs",
] }
zarrs_icechunk = "0.5.1"
# Must stay on the same major as the `icechunk` Python package pinned in pyproject.toml:
# `IcechunkBackend.from_session` deserializes a `Session` serialized by icechunk-python's
# own Rust core, and the msgpack layout of `Session` changes across majors.
icechunk = "2.1.2"
serde_json = "1.0.145"
chrono = { version = "0.4.42", features = ["clock", "std", "serde"] }
futures = "0.3.31"
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
regex = "1.9"
regex-syntax = "0.8.5"
smallvec = "1.13"
async-trait = "0.1"
internment = { version = "0.8", features = ["arc"] }
# 0.11 is the only release on pyo3 0.29 + object_store 0.13, which is what polars and
# zarrs_object_store need. 0.12 moves to object_store 0.14 and splits the graph in two,
# making stores from this crate unusable as zarrs stores.
pyo3-object_store = "0.11.0"
ambassador = "0.5.0"
parking_lot = "0.12.5"
moka = { version = "0.12.13", features = ["future", "sync"] }
rayon = "1.10"
snafu = {version = "0.8.9", features = ["backtrace"] }

# Profiling/tracing support (behind feature flag)
console-subscriber = { version = "0.4", optional = true }
tracing = { version = "0.1", optional = true }
bytemuck = "1.25.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["extension-module"]
# extension-module: Enable for Python extension builds (maturin), disable for cargo test
extension-module = ["pyo3/extension-module"]
tokio-console = ["console-subscriber", "tracing", "tokio/tracing"]
bench = []

[[bench]]
name = "chunk_processing"
harness = false
required-features = ["bench"]

[[bench]]
name = "var_column"
harness = false
required-features = ["bench"]

# Bench profile: this toolchain SIGSEGVs in LLVM when compiling polars at
# opt-level >= 1, so dependencies stay at opt-level=0 (the default for dev).
# Our crate (rainbear) is built at opt-level=3 to get realistic numbers for
# the code under test. Benchmark *ratios* are valid; absolute numbers are
# pessimistic for the dependency surface (Series::new etc.).
[profile.bench]
inherits = "dev"
codegen-units = 16
debug = "line-tables-only"

[profile.bench.package.rainbear]
opt-level = 3

[profile.release]
lto = false
codegen-units = 256
opt-level = "s"

# Profile to build a minimally sized binary
[profile.minimal-size]
inherits = "release"
opt-level = "z"
codegen-units = 1

# PEP 660 / maturin editable installs: prioritize rustc time and memory over rich debuginfo.
# (Full `dev` debug=2 is very expensive for large dependency graphs like Polars.)
[profile.maturin-dev]
inherits = "dev"
debug = "line-tables-only"
codegen-units = 256

[patch.crates-io]
# Polars patches object_store to this fork (custom DNS resolver, arrow-rs-object-store#728).
# A git dependency's own [patch.crates-io] is ignored, so polars-io fails to build against
# stock object_store unless we mirror the patch here. Keep the rev in sync with the polars tag.
object_store = { git = "https://github.com/kdn36/arrow-rs-object-store", rev = "f50a6e5c564b2b5933eca15cd20ff9b5614374a1" }


# Temporary profile for profiling: full debug symbols, no opt cost beyond dev.
[profile.profile]
inherits = "maturin-dev"
debug = 2